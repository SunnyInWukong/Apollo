---
# Builds the Apollo Windows installer (NSIS) and portable zip.
# Adapted from the ci-windows.yml upstream removed in da5a4e3e.
name: Build Windows
permissions:
  contents: write  # tag builds attach installers to a release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      # MSYS2's nodejs crashes on init (gcc-16 bad_weak_ptr), see docs/building.md
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Node path
        shell: pwsh
        run: echo "NODEJS_PATH=$(Split-Path -Parent (Get-Command node).Source)" >> $env:GITHUB_ENV

      - name: Build
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          export PATH="$PATH:$(cygpath "$NODEJS_PATH")"
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}'
          ninja -C build

      - name: Package
        run: |
          mkdir -p artifacts
          cd build
          cpack -G ZIP
          mv cpack_artifacts/*.zip ../artifacts/Apollo-Windows-AMD64-portable.zip
          # MSYS2's nsis package has no plugin dir (InstallOptions missing); use the runner's Windows NSIS
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -f "$makensis" ] || { /c/ProgramData/chocolatey/bin/choco.exe install nsis -y --no-progress && test -f "$makensis"; }
          cpack -G NSIS -D CPACK_NSIS_EXECUTABLE="$(cygpath -m "$makensis")" \
            || { tail -n 80 cpack_artifacts/_CPack_Packages/win64/NSIS/NSISOutput.log; exit 1; }
          mv cpack_artifacts/*.exe ../artifacts/Apollo-Windows-AMD64-installer.exe

      # always(): the portable zip still ships if the NSIS installer step fails
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Windows-AMD64
          path: artifacts/
          if-no-files-found: error

      # Every master build becomes the newest release: /releases/latest always has the current installer.
      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Apollo build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: artifacts/*
